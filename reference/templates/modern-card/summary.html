<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!-- modern-card/summary · 亮色卡片版 · 衍生自 clean-doc/summary -->
<!-- 发言人配色预设：在下一行写 COLORS 注释，格式为 名字=#十六进制，多人逗号分隔；名字须与实录发言人完全一致，未列出者按调色板自动配色；该注释渲染时剔除 -->
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--line:#e5e7eb;--accent:#2563EB;--navy:#1e3a8a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.9 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px 16px}
.page{max-width:880px;margin:0 auto;padding:42px 34px 52px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.mast-kicker{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:10px}
h1.doc-title{font-size:25px;color:var(--navy);padding-bottom:14px;border-bottom:2px solid var(--navy)}
/* md 的 # 一级标题由 TITLE 占位符呈现（引擎取同一行），此处隐藏正文 h1 防重复 */
.page h1:not(.doc-title){display:none}
.meta-panel{background:#EFF4FF;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:14px 18px;margin:22px 0 26px;color:#475569;font-size:14px;line-height:2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h2{font-size:18px;color:var(--navy);margin:30px 0 10px;padding:0 0 6px 12px;border-left:4px solid var(--accent);border-bottom:1px solid var(--line)}
p{margin:10px 0;overflow-wrap:anywhere;word-break:break-word}
blockquote{background:#EFF4FF;border-left:3px solid var(--accent);border-radius:8px;padding:12px 16px;margin:12px 0;color:#475569;font-size:14.5px}
ul{margin:8px 0 8px 24px}
li{margin:5px 0}
strong{color:var(--navy)}
hr{border:0;border-top:1px dashed var(--line);margin:24px 0}
.mindmap-img{width:100%;background:#fff;border:1px solid var(--line);padding:16px;margin-top:8px}
footer{max-width:880px;margin:0 auto;padding:18px 16px 26px;color:#9ca3af;font-size:12px;text-align:center}
footer a{color:#9ca3af}
@media print{body{background:#fff;padding:0}.page{border-radius:0}.meta-panel,.mindmap-img{break-inside:avoid}}
</style>
</head>
<body>
<div class="page">
  <div class="mast-kicker">{{KICKER}}</div>
  <h1 class="doc-title">{{TITLE}}</h1>
  <div class="meta-panel">{{DATE}}（时长 {{DURATION}}）· {{SPEAKERS_LINE}}</div>
{{BODY}}
<!--IF:MINDMAP-->  <h2>附：思维导图</h2>
  <img class="mindmap-img" alt="思维导图" src="data:image/png;base64,{{MINDMAP_B64}}"><!--/IF:MINDMAP-->
</div>
<footer>记录来源：<a href="{{SOURCE_URL}}">飞书妙记</a> · <!-- 复制模板时改：日期 -->2026-XX-XX</footer>
</body>
</html>
